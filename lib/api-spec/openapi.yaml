openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Apex kitchen designer API
servers:
  - url: /api
tags:
  - name: health
  - name: catalog
  - name: design
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      security: [{ AdminBearer: [] }]
      operationId: listProducts
      tags: [catalog]
      summary: List available product records including demo status
      responses:
        "200":
          description: Product records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      security: [{ AdminBearer: [] }]
      operationId: createProduct
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /catalog/products:
    get:
      operationId: listPublicProducts
      tags: [catalog]
      summary: List public product catalog fields
      responses:
        "200":
          description: Public product records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
    post:
      operationId: createPublicProduct
      tags: [catalog]
      summary: Submit a demo product to the public catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicProductInput"
      responses:
        "201":
          description: Created demo product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
  /products/{id}:
    patch:
      security: [{ AdminBearer: [] }]
      operationId: updateProduct
      tags: [catalog]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      security: [{ AdminBearer: [] }]
      operationId: deleteProduct
      tags: [catalog]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /products/import:
    post:
      security: [{ AdminBearer: [] }]
      operationId: importProducts
      tags: [catalog]
      summary: Import an Excel-exported CSV, upserting by SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /catalog-summary:
    get:
      security: [{ AdminBearer: [] }]
      operationId: getCatalogSummary
      tags: [catalog]
      responses:
        "200":
          description: Catalog statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSummary"
  /designs/generate:
    post:
      operationId: generateDesign
      tags: [design]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignInput"
      responses:
        "200":
          description: Constrained concept layout and matching catalog suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignResult"
  /designs/render:
    post:
      operationId: renderDesignImage
      tags: [design]
      summary: Generate an illustrative photorealistic interior concept from measured geometry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignInput"
      responses:
        "200":
          description: Generated image for immediate display, not a fabrication drawing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignImage"
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-admin-key
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean }
    ProductInput:
      type: object
      required: [sku, name, category, status]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [base_cabinet, wall_cabinet, tall_cabinet, countertop, island, accessory] }
        collection: { type: string }
        finish: { type: string }
        material: { type: string }
        widthIn: { type: ["number", "null"] }
        heightIn: { type: ["number", "null"] }
        depthIn: { type: ["number", "null"] }
        lengthIn: { type: ["number", "null"] }
        price: { type: ["number", "null"] }
        cost: { type: ["number", "null"] }
        stockQty: { type: ["integer", "null"] }
        unit: { type: string }
        status: { type: string, enum: [demo, verified, inactive] }
        notes: { type: string }
        productUrl: { type: string }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    PublicProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, category]
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, enum: [base_cabinet, wall_cabinet, tall_cabinet, countertop, island, accessory] }
        collection: { type: string, maxLength: 120 }
        finish: { type: string, maxLength: 120 }
        material: { type: string, maxLength: 120 }
        widthIn: { type: ["number", "null"], minimum: 0.001 }
        heightIn: { type: ["number", "null"], minimum: 0.001 }
        depthIn: { type: ["number", "null"], minimum: 0.001 }
        lengthIn: { type: ["number", "null"], minimum: 0.001 }
        price: { type: ["number", "null"], minimum: 0.001 }
        unit: { type: string, maxLength: 30 }
        productUrl: { type: string, maxLength: 500 }
    PublicProduct:
      type: object
      required: [id, sku, name, category, status]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        category: { type: string, enum: [base_cabinet, wall_cabinet, tall_cabinet, countertop, island, accessory] }
        collection: { type: ["string", "null"] }
        finish: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        widthIn: { type: ["number", "null"] }
        heightIn: { type: ["number", "null"] }
        depthIn: { type: ["number", "null"] }
        lengthIn: { type: ["number", "null"] }
        price: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        status: { type: string, enum: [demo, verified, inactive] }
        productUrl: { type: ["string", "null"] }
    CatalogImportInput:
      type: object
      required: [csv]
      properties:
        csv: { type: string }
    ImportResult:
      type: object
      required: [created, updated, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        errors:
          type: array
          items: { type: string }
    CatalogSummary:
      type: object
      required: [total, verified, demo, cabinets, countertops]
      properties:
        total: { type: integer }
        verified: { type: integer }
        demo: { type: integer }
        cabinets: { type: integer }
        countertops: { type: integer }
    WindowInput:
      type: object
      required: [wall, offsetIn, widthIn, sillHeightIn, heightIn]
      properties:
        wall: { type: string }
        offsetIn: { type: number }
        widthIn: { type: number }
        sillHeightIn: { type: number }
        heightIn: { type: number }
    OpeningInput:
      type: object
      required: [wall, offsetIn, widthIn]
      properties:
        wall: { type: string }
        offsetIn: { type: number }
        widthIn: { type: number }
    FixtureInput:
      type: object
      required: [kind, wall, offsetIn, widthIn]
      properties:
        kind: { type: string, enum: [sink, range, fridge, dishwasher] }
        wall: { type: string }
        offsetIn: { type: number }
        widthIn: { type: number }
    IslandInput:
      type: object
      required: [mode, widthIn, lengthIn, fromLeftIn, fromBackIn]
      properties:
        mode: { type: string, enum: [none, existing, new] }
        widthIn: { type: number }
        lengthIn: { type: number }
        fromLeftIn: { type: number }
        fromBackIn: { type: number }
    DesignInput:
      type: object
      required: [layout, walls, roomDepthIn, ceilingIn, windows, openings, fixtures, island, style, countertop]
      properties:
        layout: { type: string, enum: [l, u, galley, single, open] }
        walls:
          type: object
          additionalProperties: { type: number }
        roomDepthIn: { type: number }
        ceilingIn: { type: number }
        windows:
          type: array
          items: { $ref: "#/components/schemas/WindowInput" }
        openings:
          type: array
          items: { $ref: "#/components/schemas/OpeningInput" }
        fixtures:
          type: array
          items: { $ref: "#/components/schemas/FixtureInput" }
        island: { $ref: "#/components/schemas/IslandInput" }
        style: { type: string }
        countertop: { type: string }
    DesignModule:
      type: object
      required: [wall, offsetIn, widthIn, category, label]
      properties:
        wall: { type: string }
        offsetIn: { type: number }
        widthIn: { type: number }
        category: { type: string }
        label: { type: string }
        productId: { type: ["integer", "null"] }
    DesignResult:
      type: object
      required: [title, summary, modules, products, warnings, approximateTotal, verified]
      properties:
        title: { type: string }
        summary: { type: string }
        modules:
          type: array
          items: { $ref: "#/components/schemas/DesignModule" }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        warnings:
          type: array
          items: { type: string }
        approximateTotal: { type: ["number", "null"] }
        verified: { type: boolean }
    DesignImage:
      type: object
      required: [imageDataUrl, disclaimer]
      properties:
        imageDataUrl: { type: string }
        disclaimer: { type: string }